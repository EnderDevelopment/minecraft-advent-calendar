# Adventskalender Konfiguration
# Hier können die Geschenke für jeden Tag des Adventskalenders definiert werden.
# Jeder Tag hat ein Material, eine Anzahl und einen Namen.

# Beispiel für ein Geschenk:
# day1:
#   material: DIAMOND
#   amount: 1
#   name: "Diamant"

